name = "driver"
description = "Reword command line driver"
version = "0.1.0-dev"

authors = ["Max Reznik"]
maintainers = ["Max Reznik <reznikmm@gmail.com>"]
maintainers-logins = ["reznikmm"]
licenses = "Apache-2.0 WITH LLVM-exception"
website = ""
tags = []

executables = ["reword-run"]

[build-switches]
"*".Ada_Version = "Ada2022"
development.optimization = ["-O0"]
development.style_checks = ["-gnaty", "-gnaty-B"]
development.contracts = "Yes"
"*".debug_info = "Yes"

[build-profiles]
"reword" = "development"

[[depends-on]]
trendy_test = "^0"
reword = "*"

[[pins]]
reword = { path = ".." }
